<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Log training</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-sportchip{border:1.5px solid var(--stone-300);background:var(--surface);border-radius:999px;padding:7px 13px;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-700);cursor:pointer;white-space:nowrap;}
.of-sportchip.active{border-color:var(--pine);background:var(--pine);color:var(--cream);}
.of-startopt{flex:1;border:1.5px solid var(--stone-300);border-radius:12px;background:var(--surface);padding:12px 10px;text-align:center;cursor:pointer;}
.of-startopt.active{border-color:var(--pine);background:var(--pine-tint);}
.of-field{height:38px;border-radius:8px;border:1.5px solid var(--stone-300);padding:0 8px;font-family:var(--font-body);font-size:13.5px;color:var(--ink-900);background:var(--surface);width:100%;box-sizing:border-box;text-align:center;}
.of-namefield{height:46px;border-radius:10px;border:1.5px solid var(--pine);padding:0 14px;font-family:var(--font-body);font-size:14.5px;color:var(--ink-900);background:var(--surface);width:100%;box-sizing:border-box;text-align:left;box-shadow:0 0 0 3px var(--pine-tint);}
.of-namefield:focus{outline:none;}
.of-matchcard{background:var(--surface);border:1.5px solid var(--stone-300);border-radius:12px;box-shadow:0 12px 24px -14px rgba(20,24,28,0.25);overflow:hidden;}
.of-matchrow{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;}
.of-matchrow.selected{background:var(--pine-tint);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="padding:44px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
      <button aria-label="Back" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"></polyline></svg>
      </button>
      <span style="font-family:var(--font-display);font-weight:600;font-size:15px;">Log training</span>
      <span style="width:32px;"></span>
    </div>

    <div style="padding:14px 20px 0;flex-shrink:0;display:flex;gap:8px;overflow-x:auto;">
      <button class="of-sportchip active">Weight Lifting</button>
      <button class="of-sportchip">Running</button>
      <button class="of-sportchip">Cycling</button>
      <button class="of-sportchip">Swimming</button>
      <button class="of-sportchip">General</button>
    </div>

    <div style="padding:14px 20px 0;flex-shrink:0;display:flex;gap:8px;">
      <button class="of-startopt active"><div style="font-weight:600;font-size:12.5px;">Blank workout</div></button>
      <button class="of-startopt"><div style="font-weight:600;font-size:12.5px;">From template</div></button>
    </div>

    <div style="padding:14px 20px 0;flex-shrink:0;position:relative;">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);display:block;margin-bottom:7px;">Workout name</span>
      <input class="of-namefield" value="Push d" placeholder="e.g. Push day, Leg day…" aria-label="Workout name">

      <!-- Match popup: appears as the client types, matching against workouts they've logged before -->
      <div class="of-matchcard" style="position:absolute;left:20px;right:20px;top:74px;z-index:2;">
        <div style="padding:9px 14px 7px;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);border-bottom:1px solid var(--stone-150);">Matches a workout you've logged</div>
        <div class="of-matchrow selected">
          <span style="width:32px;height:32px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13.5px;font-weight:600;">Push day</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">5 exercises · logged 6 times · last Tue</div></div>
          <span style="font-size:11.5px;font-weight:600;color:var(--pine-dark);flex-shrink:0;">Use this</span>
        </div>
        <div style="border-top:1px solid var(--stone-150);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-500)" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span style="font-size:12.5px;color:var(--ink-700);">No match — keep typing to create <b>"Push d…"</b> as a new workout</span>
        </div>
      </div>
    </div>

    <div style="padding:88px 20px 0;overflow:hidden;flex-grow:1;display:flex;flex-direction:column;">
      <div style="display:grid;grid-template-columns:1.6fr 0.7fr 0.7fr 0.9fr;gap:6px;margin-bottom:6px;">
        <span style="font-size:10.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-500);">Exercise</span>
        <span style="font-size:10.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-500);text-align:center;">Sets</span>
        <span style="font-size:10.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-500);text-align:center;">Reps</span>
        <span style="font-size:10.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-500);text-align:center;">Wt (lb)</span>
      </div>
      <div style="display:grid;grid-template-columns:1.6fr 0.7fr 0.7fr 0.9fr;gap:6px;align-items:center;padding:6px 0;">
        <span style="font-size:13.5px;font-weight:500;">Bench Press</span>
        <input class="of-field" value="3">
        <input class="of-field" value="10">
        <input class="of-field" value="135">
      </div>

      <button style="display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:10px;border:1.5px dashed var(--stone-300);background:transparent;color:var(--pine-dark);font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;margin-top:6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Add exercise
      </button>
    </div>

    <div style="flex-shrink:0;padding:14px 20px 22px;border-top:1px solid var(--stone-300);background:var(--surface);display:flex;flex-direction:column;gap:8px;">
      <button style="width:100%;height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Save workout</button>
      <button style="width:100%;height:20px;border:none;background:transparent;color:var(--pine-dark);font-family:var(--font-body);font-weight:600;font-size:12.5px;cursor:pointer;">Save as workout template</button>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
