<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Video call lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --pine:#3F6B4F; --pine-dark:#2C4F39;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:#0B0D0C;}
.of-ctrlbtn{width:52px;height:52px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0D0C;font-family:var(--font-body);color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 38%, #262A27 0%, #0B0D0C 72%);"></div>

  <div style="position:relative;padding:52px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
    <button aria-label="Cancel" style="width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
    </button>
    <span style="font-family:var(--font-display);font-weight:600;font-size:14.5px;">Ready to join?</span>
    <span style="width:36px;"></span>
  </div>

  <div style="position:relative;flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center;">

    <div style="width:220px;height:290px;border-radius:24px;background:linear-gradient(160deg,#2A2E2B 0%,#14181C 100%);position:relative;overflow:hidden;box-shadow:0 24px 48px -20px rgba(0,0,0,0.6);">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:var(--pine);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:22px;">AR</span>
      <span style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.45);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;">You</span>
    </div>

    <div style="display:flex;gap:14px;margin-top:24px;">
      <button class="of-ctrlbtn" style="background:rgba(255,255,255,0.12);color:#fff;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12,2 a3.5,3.5 0 0 1 3.5,3.5 v6 a3.5,3.5 0 0 1 -7,0 v-6 A3.5,3.5 0 0 1 12,2 Z"></path><path d="M6,10.5 a6,6 0 0 0 12,0"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      </button>
      <button class="of-ctrlbtn" style="background:rgba(255,255,255,0.12);color:#fff;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2.5"></rect><path d="M16,10 l6,-3.5 v11 L16,14"></path></svg>
      </button>
    </div>

    <div style="margin-top:26px;">
      <div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Strength training</div>
      <div style="font-size:12.5px;color:#9CA69C;margin-top:4px;">with Taylor Brooks · 45 min</div>
    </div>

    <div style="margin-top:18px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:999px;padding:7px 14px;">
      <span style="width:7px;height:7px;border-radius:50%;background:#8FB89B;"></span>
      <span style="font-size:12px;color:#D8D5CC;">Taylor is in the waiting room</span>
    </div>

  </div>

  <div style="position:relative;flex-shrink:0;padding:16px 24px 34px;">
    <button style="width:100%;height:52px;border:none;border-radius:14px;background:var(--pine);color:#fff;font-family:var(--font-body);font-weight:700;font-size:16px;cursor:pointer;">Join call</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
