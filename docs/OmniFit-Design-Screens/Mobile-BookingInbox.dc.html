<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Booking Inbox (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --plum:#7C6A9C; --plum-dark:#5C4E78; --lilac:#DDD2F3;
  --sage:#BFE0C2; --butter:#F7E5A0; --peach:#F8D9BE; --blush:#F8CFDD; --sky:#C3DCF4;
  --warning:#B8842A; --warning-tint:#F7E5A0; --danger:#C1503D; --danger-tint:#F6DAD3;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.m-header{display:flex;align-items:center;justify-content:space-between;padding:50px 16px 12px;flex-shrink:0;}
.m-h-title{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink-900);}
.m-bell{width:34px;height:34px;border-radius:10px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--ink-900);cursor:pointer;}
.m-content{flex:1;overflow:hidden;padding:2px 16px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
.chips{display:flex;gap:8px;}
.chip{border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;border:1.5px solid var(--stone-300);background:var(--surface);color:var(--ink-700);cursor:pointer;}
.chip.active{background:var(--pine-tint);color:var(--pine-dark);border-color:var(--pine-tint);}
.list{display:flex;flex-direction:column;gap:10px;}
.req-card{display:flex;gap:10px;background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;padding:12px;text-align:left;cursor:pointer;align-items:flex-start;}
.req-avatar{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--ink-900);flex-shrink:0;}
.req-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.req-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.req-name{font-weight:600;font-size:13.5px;color:var(--ink-900);}
.req-time{font-size:11.5px;color:var(--ink-700);}
.req-type{font-size:11px;color:var(--ink-500);}
.chev{color:var(--ink-500);flex-shrink:0;margin-top:2px;}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:600;white-space:nowrap;}
.pill-danger{background:var(--danger-tint);color:var(--danger);}
.pill-neutral{background:var(--stone-150);color:var(--ink-700);}
.section-cap{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin:0 0 8px;}
.sheet{background:var(--surface);border:1px solid var(--stone-300);border-radius:16px 16px 12px 12px;padding:16px;box-sizing:border-box;}
.sheet-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--stone-150);padding-bottom:12px;margin-bottom:12px;}
.sheet-avatar{width:38px;height:38px;border-radius:999px;background:var(--butter);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-900);flex-shrink:0;}
.sheet-name{font-weight:600;font-size:14px;color:var(--ink-900);}
.sheet-meta{font-size:11.5px;color:var(--ink-500);}
.sheet-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.sheet-row{display:flex;justify-content:space-between;font-size:12.5px;}
.sheet-row .l{color:var(--ink-500);}
.sheet-row .v{color:var(--ink-900);font-weight:500;}
.sheet-btns{display:flex;gap:8px;}
.btn-primary{height:40px;border-radius:10px;background:var(--pine);color:var(--surface);border:none;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;flex:1;}
.btn-outline{height:40px;border-radius:10px;background:transparent;border:1.5px solid var(--ink-900);color:var(--ink-900);font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;flex:1;}
.toast{display:inline-flex;align-items:center;gap:8px;background:var(--ink-900);color:var(--surface);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:500;}
.toast .ic{color:var(--sage);flex-shrink:0;}
.empty{background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;padding:18px;display:flex;align-items:center;gap:12px;box-sizing:border-box;}
.empty-ic{width:40px;height:40px;border-radius:999px;background:var(--stone-150);display:flex;align-items:center;justify-content:center;color:var(--ink-500);flex-shrink:0;}
.empty h3{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-900);margin:0;}
.empty p{font-size:11px;color:var(--ink-500);margin:2px 0 0;}
.tabbar{border-top:1px solid var(--stone-300);background:var(--surface);display:flex;justify-content:space-around;align-items:center;padding:8px 0 22px;flex-shrink:0;}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;color:var(--ink-500);font-size:10px;font-weight:600;cursor:pointer;}
.tab-btn.active{color:var(--pine-dark);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div class="m-header">
    <span class="m-h-title">Sessions</span>
    <button class="m-bell" type="button" aria-label="Notifications">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </button>
  </div>

  <div class="m-content">
    <div class="chips">
      <button class="chip" type="button">All</button>
      <button class="chip active" type="button" aria-pressed="true">Pending · 3</button>
      <button class="chip" type="button">Upcoming</button>
      <button class="chip" type="button">Past</button>
    </div>

    <div class="list">
      <button class="req-card" type="button">
        <span class="req-avatar" style="background:var(--sky);">AC</span>
        <span class="req-body">
          <span class="req-top"><span class="req-name">Alex Chen</span><span class="pill pill-neutral">Pay at booking</span></span>
          <span class="req-time">Thu, Sep 25 · 9:00–10:00 AM</span>
          <span class="req-type">Strength Training</span>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="req-card" type="button">
        <span class="req-avatar" style="background:var(--butter);">PN</span>
        <span class="req-body">
          <span class="req-top"><span class="req-name">Priya Nair</span><span class="pill pill-danger">Unpaid</span></span>
          <span class="req-time">Fri, Sep 26 · 5:30–6:30 PM</span>
          <span class="req-type">Mobility &amp; Recovery</span>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div>
      <p class="section-cap">Tap a request — action sheet</p>
      <div class="sheet">
        <div class="sheet-head">
          <span class="sheet-avatar">PN</span>
          <div>
            <div class="sheet-name">Priya Nair</div>
            <div class="sheet-meta">Requested 2 hours ago</div>
          </div>
        </div>
        <div class="sheet-rows">
          <div class="sheet-row"><span class="l">Type</span><span class="v">Mobility &amp; Recovery</span></div>
          <div class="sheet-row"><span class="l">Time</span><span class="v">Fri, Sep 26 · 5:30 PM</span></div>
          <div class="sheet-row"><span class="l">Payment</span><span class="v"><span class="pill pill-danger">Unpaid</span></span></div>
        </div>
        <div class="sheet-btns">
          <button class="btn-outline" type="button">Decline</button>
          <button class="btn-primary" type="button">Accept</button>
        </div>
      </div>
    </div>

    <div>
      <p class="section-cap">After accept</p>
      <div class="toast">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        Request confirmed
      </div>
    </div>

    <div>
      <p class="section-cap">Empty state</p>
      <div class="empty">
        <div class="empty-ic">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <div>
          <h3>No pending requests</h3>
          <p>New requests will show up here.</p>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Home
    </button>
    <button class="tab-btn active" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Sessions
    </button>
    <button class="tab-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Messages
    </button>
    <button class="tab-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
