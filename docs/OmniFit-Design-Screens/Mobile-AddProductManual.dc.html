<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Add product manually</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-field{width:100%;height:46px;border-radius:10px;border:1.5px solid var(--stone-300);background:var(--surface);padding:0 14px;font-family:var(--font-body);font-size:14px;color:var(--ink-900);box-sizing:border-box;}
.of-label{font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);display:block;margin-bottom:7px;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="padding:44px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
      <button aria-label="Back" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"></polyline></svg>
      </button>
      <span style="font-family:var(--font-display);font-weight:600;font-size:15px;">Add product</span>
      <span style="width:32px;"></span>
    </div>

    <div style="padding:16px 20px 0;overflow:hidden;flex-grow:1;display:flex;flex-direction:column;gap:16px;">

      <div><span class="of-label">Product name</span><input class="of-field" placeholder="e.g. Overnight oats"></div>
      <div><span class="of-label">Brand (optional)</span><input class="of-field" placeholder="e.g. Quaker"></div>

      <div style="display:flex;gap:12px;">
        <div style="flex:1;"><span class="of-label">Serving size</span><input class="of-field" placeholder="1"></div>
        <div style="flex:1;"><span class="of-label">Unit</span><input class="of-field" placeholder="cup"></div>
      </div>

      <div style="height:1px;background:var(--stone-300);margin:2px 0;"></div>
      <span style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Nutrition per serving</span>

      <div><span class="of-label">Calories</span><input class="of-field" placeholder="0" inputmode="numeric"></div>

      <div style="display:flex;gap:12px;">
        <div style="flex:1;"><span class="of-label">Protein (g)</span><input class="of-field" placeholder="0" inputmode="numeric"></div>
        <div style="flex:1;"><span class="of-label">Carbs (g)</span><input class="of-field" placeholder="0" inputmode="numeric"></div>
        <div style="flex:1;"><span class="of-label">Fat (g)</span><input class="of-field" placeholder="0" inputmode="numeric"></div>
      </div>

      <label style="display:flex;align-items:center;gap:10px;padding-top:2px;">
        <input type="checkbox" style="width:20px;height:20px;accent-color:var(--pine);">
        <span style="font-size:13.5px;color:var(--ink-700);">Save to my food library for next time</span>
      </label>

    </div>

    <div style="flex-shrink:0;padding:14px 20px 22px;border-top:1px solid var(--stone-300);background:var(--surface);">
      <button style="width:100%;height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Add to log</button>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
