<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Barcode not found</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:52px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
    <button aria-label="Close" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
    </button>
    <span style="font-family:var(--font-display);font-weight:600;font-size:15px;">Scan barcode</span>
    <span style="width:32px;"></span>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:0 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">

    <span style="width:76px;height:76px;border-radius:50%;background:var(--stone-150);display:flex;align-items:center;justify-content:center;margin-bottom:22px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--ink-500)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="1.5"></rect><line x1="6" y1="6" x2="6" y2="18"></line><line x1="8.5" y1="6" x2="8.5" y2="18"></line><line x1="12" y1="6" x2="12" y2="18"></line><line x1="15" y1="6" x2="15" y2="18"></line><line x1="17.5" y1="6" x2="17.5" y2="18"></line><line x1="2" y1="2" x2="22" y2="22"></line></svg>
    </span>

    <h1 style="margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.01em;">Product not found</h1>
    <p style="margin:0 0 8px;font-size:14px;color:var(--ink-500);line-height:1.6;max-width:270px;">We couldn't match that barcode to anything in our database.</p>
    <div style="background:var(--stone-150);border-radius:9px;padding:8px 14px;font-family:'Space Grotesk',monospace;font-size:13px;letter-spacing:0.04em;color:var(--ink-700);margin-top:6px;">0 41390 01005 8</div>

    <div style="width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px;margin-top:30px;">
      <button style="width:100%;height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Add manually</button>
      <button style="width:100%;height:46px;border:1.5px solid var(--stone-300);border-radius:10px;background:var(--surface);color:var(--ink-900);font-family:var(--font-body);font-weight:600;font-size:14.5px;cursor:pointer;">Scan again</button>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
