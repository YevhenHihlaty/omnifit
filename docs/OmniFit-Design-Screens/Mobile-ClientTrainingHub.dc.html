<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Training hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-wrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--stone-150);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:48px 20px 16px;display:flex;flex-direction:column;gap:18px;">

    <h1 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-0.01em;">Training</h1>

    <div style="background:var(--ink-900);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;">
      <span style="color:#9CA69C;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">Up next</span>
      <div>
        <div style="color:var(--cream);font-weight:600;font-size:16px;">Strength session with Taylor</div>
        <div style="color:#9CA69C;font-size:12.5px;margin-top:2px;">Today, 2:00 PM · In studio · 45 min</div>
      </div>
    </div>

    <button style="width:100%;height:52px;border:none;border-radius:12px;background:var(--pine);color:var(--cream);font-family:var(--font-display);font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--cream)" stroke="none"><polygon points="6,4 20,12 6,20"></polygon></svg>
      Start workout
    </button>

    <div style="display:flex;flex-direction:column;gap:10px;flex-grow:1;min-height:0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:13px;font-weight:700;">Recent workouts</span>
        <a href="#library" style="font-size:12px;color:var(--pine-dark);text-decoration:none;font-weight:600;">My workouts</a>
      </div>

      <div style="background:var(--surface);border:1px solid var(--stone-300);border-radius:14px;padding:2px 14px;">
        <div class="of-wrow">
          <span style="width:32px;height:32px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg></span>
          <div style="flex-grow:1;"><div style="font-weight:600;font-size:13.5px;">Push day</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">5 exercises · 18 sets</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);">Yesterday</span>
        </div>
        <div class="of-wrow">
          <span style="width:32px;height:32px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg></span>
          <div style="flex-grow:1;"><div style="font-weight:600;font-size:13.5px;">Leg day</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">4 exercises · 14 sets</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);">3 days ago</span>
        </div>
        <div class="of-wrow" style="border-bottom:none;">
          <span style="width:32px;height:32px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg></span>
          <div style="flex-grow:1;"><div style="font-weight:600;font-size:13.5px;">Full body</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">6 exercises · 20 sets</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);">5 days ago</span>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
