<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — What's your primary goal?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:38px 24px 20px;display:flex;flex-direction:column;">

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;font-weight:600;color:var(--ink-500);">Step 1 of 3</span>
      </div>
      <div style="height:4px;border-radius:999px;background:var(--stone-300);overflow:hidden;"><div style="width:33%;height:100%;background:var(--pine);"></div></div>
    </div>

    <h1 style="margin:0 0 20px;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-0.01em;text-wrap:balance;">What's your primary goal?</h1>

    <div role="radiogroup" aria-label="Primary goal" style="display:flex;flex-direction:column;gap:11px;">

      <button role="radio" aria-checked="true" style="text-align:left;min-height:88px;border-radius:16px;border:2px solid var(--pine);background:var(--pine-tint);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;">
        <span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
        </span>
        <div style="flex-grow:1;"><div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Weight loss</div><div style="font-size:12px;color:var(--pine-dark);margin-top:2px;">Calorie tracking, weekly check-ins</div></div>
        <span style="width:20px;height:20px;border-radius:50%;background:var(--pine);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--cream)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,13 10,18 19,7"></polyline></svg></span>
      </button>

      <button role="radio" aria-checked="false" style="text-align:left;min-height:88px;border-radius:16px;border:2px solid var(--stone-300);background:var(--surface);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;">
        <span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--stone-150);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-700)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line></svg>
        </span>
        <div style="flex-grow:1;"><div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Muscle gain</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">Strength programs, volume tracking</div></div>
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--stone-300);flex-shrink:0;"></span>
      </button>

      <button role="radio" aria-checked="false" style="text-align:left;min-height:88px;border-radius:16px;border:2px solid var(--stone-300);background:var(--surface);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;">
        <span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--stone-150);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-700)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,13 7,13 9,8 13,18 15,13 22,13"></polyline></svg>
        </span>
        <div style="flex-grow:1;"><div style="font-family:var(--font-display);font-weight:600;font-size:16px;">General conditioning</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">Habits, mobility, overall fitness</div></div>
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--stone-300);flex-shrink:0;"></span>
      </button>

      <button role="radio" aria-checked="false" style="text-align:left;min-height:88px;border-radius:16px;border:2px solid var(--stone-300);background:var(--surface);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;">
        <span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--stone-150);display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-700)" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>
        </span>
        <div style="flex-grow:1;"><div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Something else</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">Not on this list? Tell us in your own words</div></div>
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--stone-300);flex-shrink:0;"></span>
      </button>

    </div>

    <div style="flex-grow:1;"></div>

    <button style="height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Continue</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
