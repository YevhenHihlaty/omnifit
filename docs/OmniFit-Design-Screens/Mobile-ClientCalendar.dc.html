<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-seg{display:flex;border:1.5px solid var(--stone-300);border-radius:999px;padding:2px;gap:2px;}
.of-seg-btn{border:none;background:transparent;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-500);padding:6px 16px;border-radius:999px;cursor:pointer;flex:1;text-align:center;}
.of-seg-btn.active{background:var(--ink-900);color:var(--cream);}
.of-day{width:42px;flex-shrink:0;text-align:center;border-radius:12px;padding:8px 0;cursor:pointer;}
.of-day.active{background:var(--pine);color:var(--cream);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="padding:48px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
      <h1 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;">Calendar</h1>
      <button style="height:34px;padding:0 13px;border:none;border-radius:999px;background:var(--pine);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:12px;cursor:pointer;">Request session</button>
    </div>

    <div style="padding:14px 20px 0;flex-shrink:0;">
      <div class="of-seg">
        <button class="of-seg-btn">Day</button>
        <button class="of-seg-btn active">Week</button>
        <button class="of-seg-btn">Month</button>
      </div>
    </div>

    <div style="padding:14px 20px 0;flex-shrink:0;display:flex;gap:6px;overflow-x:auto;">
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Mon</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">15</div></div>
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Tue</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">16</div></div>
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Wed</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">17</div></div>
      <div class="of-day active"><div style="font-size:10px;opacity:0.85;">Thu</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">18</div></div>
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Fri</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">19</div></div>
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Sat</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">20</div></div>
      <div class="of-day"><div style="font-size:10px;color:inherit;opacity:0.7;">Sun</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;">21</div></div>
    </div>

    <div style="padding:18px 20px 16px;overflow:hidden;flex-grow:1;display:flex;flex-direction:column;gap:10px;">

      <span style="font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-500);">Thursday, Sep 18</span>

      <div style="background:var(--pine);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;">
        <span style="color:var(--pine-tint);font-size:11.5px;font-weight:600;">2:00 PM · 45 min</span>
        <span style="color:var(--cream);font-weight:600;font-size:15px;">Strength session with Taylor</span>
        <span style="color:var(--pine-tint);font-size:12px;">In studio · Riverside Fitness</span>
      </div>

      <div style="background:var(--surface);border:1px dashed var(--stone-300);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-500);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span style="font-size:13px;font-weight:500;">No other sessions today</span>
      </div>

      <span style="font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-500);margin-top:6px;">Upcoming</span>

      <div style="background:var(--surface);border:1px solid var(--stone-300);border-radius:14px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:600;font-size:14px;">Check-in call · Taylor Brooks</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">Mon, Sep 22 · 3:30 PM · Video</div></div>
        <span style="background:var(--pine-tint);color:var(--pine-dark);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;">Confirmed</span>
      </div>

    </div>

  </div>

  <nav style="flex-shrink:0;height:76px;background:var(--surface);border-top:1px solid var(--stone-300);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;">
    <a href="#home" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink-500);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="2"></rect><polyline points="3,10 12,3 21,10"></polyline></svg>
      <span style="font-size:10px;font-weight:500;">Home</span>
    </a>
    <a href="#log" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink-500);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line></svg>
      <span style="font-size:10px;font-weight:500;">Log</span>
    </a>
    <a href="#progress" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--pine-dark);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span style="font-size:10px;font-weight:600;">Calendar</span>
    </a>
    <a href="#coach" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink-500);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,5 H20 V16 H9 L4,20 Z"></path></svg>
      <span style="font-size:10px;font-weight:500;">Coach</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
