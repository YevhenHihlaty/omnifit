<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Coach Notes (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --plum:#7C6A9C; --plum-dark:#5C4E78; --lilac:#DDD2F3;
  --sage:#BFE0C2; --butter:#F7E5A0; --peach:#F8D9BE; --blush:#F8CFDD; --sky:#C3DCF4;
  --warning:#B8842A; --warning-tint:#F7E5A0; --danger:#C1503D; --danger-tint:#F6DAD3;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.screen{position:relative;}
.hdr{display:flex;align-items:center;gap:12px;padding:50px 16px 10px;box-sizing:border-box;}
.iconbtn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px;}
.iconbtn svg{width:19px;height:19px;}
.hdr h1{flex:1 1 auto;text-align:center;font-family:var(--font-display);font-size:15px;font-weight:600;margin:0;}
.searchbox{position:relative;margin:6px 16px 12px;}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-500);}
.searchbox input{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--stone-300);padding:0 12px 0 34px;background:var(--surface);font-size:13.5px;font-family:var(--font-body);box-sizing:border-box;}
.rows{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
.notecard{background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.nc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nc-title{font-size:13px;font-weight:600;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nc-time{font-size:10.5px;color:var(--ink-500);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.nc-preview{font-size:12px;color:var(--ink-700);line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.nc-client{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-700);}
.nc-client .av{width:15px;height:15px;border-radius:50%;background:var(--sage);font-size:7.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-900);}
.backdrop{position:absolute;left:0;right:0;top:230px;bottom:0;background:rgba(20,24,28,.42);}
.sheet{position:absolute;left:0;right:0;bottom:0;height:650px;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(20,24,28,.16);box-sizing:border-box;padding:14px 20px 22px;display:flex;flex-direction:column;gap:12px;}
.handle{width:36px;height:4px;border-radius:2px;background:var(--stone-300);margin:0 auto;}
.sheethdr{display:flex;align-items:center;justify-content:space-between;}
.sheethdr h2{font-family:var(--font-display);font-size:16px;font-weight:700;margin:0;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);}
.field input,.field select,.field textarea{border-radius:10px;border:1.5px solid var(--stone-300);padding:0 13px;background:var(--surface);font-size:13.5px;font-family:var(--font-body);color:var(--ink-900);box-sizing:border-box;}
.field input,.field select{height:44px;}
.field textarea{height:170px;padding:11px 13px;resize:none;line-height:1.5;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1 1 0;min-width:0;}
.savebtn{height:48px;border-radius:10px;background:var(--pine);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:14.5px;border:none;margin-top:2px;}
.captiontag{position:absolute;left:16px;background:var(--lilac);color:var(--plum-dark);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:6px;z-index:5;}
</style>
</helmet>
<div class="screen" style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);overflow:hidden;">

  <div class="hdr">
    <button class="iconbtn" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Notes</h1>
    <button class="iconbtn" type="button" aria-label="New note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Search notes">
  </div>

  <div class="rows">
    <div class="notecard">
      <div class="nc-top">
        <span class="nc-title">Post-session observations</span>
        <span class="nc-time">9:40 AM</span>
      </div>
      <p class="nc-preview">Form on split squats improved a lot since last week — depth is consistent now.</p>
      <span class="nc-client"><span class="av">MR</span>Maya R.</span>
    </div>

    <div class="notecard">
      <div class="nc-top">
        <span class="nc-title">Nutrition check-in call</span>
        <span class="nc-time">Yesterday</span>
      </div>
      <p class="nc-preview">Discussed protein targets and meal timing around travel.</p>
      <span class="nc-client"><span class="av">JT</span>Jon T.</span>
    </div>
  </div>

  <div class="backdrop"></div>
  <div class="sheet">
    <span class="captiontag" style="position:static;align-self:flex-start;">Note editor</span>
    <div class="handle"></div>
    <div class="sheethdr">
      <h2>Edit note</h2>
      <button class="iconbtn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="field">
      <label for="mntitle">Title (optional)</label>
      <input id="mntitle" type="text" value="Post-session observations">
    </div>
    <div class="row2">
      <div class="field">
        <label for="mnclient">Client</label>
        <select id="mnclient">
          <option>No client</option>
          <option selected>Maya R.</option>
        </select>
      </div>
      <div class="field">
        <label for="mnsession">Related session</label>
        <select id="mnsession">
          <option>None</option>
          <option selected>Sep 20</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="mnbody">Note</label>
      <textarea id="mnbody">Form on split squats improved a lot since last week — depth is consistent now. Still favoring the right leg slightly on the way up.</textarea>
    </div>
    <button class="savebtn" type="submit">Save note</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
