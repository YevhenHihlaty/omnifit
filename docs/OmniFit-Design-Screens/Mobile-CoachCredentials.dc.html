<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Certifications & experience</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-pillbtn{border:1.5px solid var(--stone-300);background:var(--surface);border-radius:999px;padding:8px 14px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-700);cursor:pointer;}
.of-pillbtn.active{border-color:var(--pine);background:var(--pine);color:var(--cream);}
.of-cert{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;}
.of-tag-remove{width:17px;height:17px;border-radius:50%;background:var(--stone-150);border:none;color:var(--ink-500);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:32px 24px 18px;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;font-weight:600;color:var(--ink-500);">Step 2 of 7</span>
        <a href="#skip" style="font-size:12px;font-weight:600;color:var(--ink-500);text-decoration:none;">Skip</a>
      </div>
      <div style="height:4px;border-radius:999px;background:var(--stone-300);overflow:hidden;"><div style="width:29%;height:100%;background:var(--pine);"></div></div>
    </div>

    <div>
      <h1 style="margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-0.01em;text-wrap:balance;">Certifications &amp; experience</h1>
      <p style="margin:0;font-size:13.5px;color:var(--ink-500);line-height:1.4;">Builds trust with clients browsing coaches.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Years coaching</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="of-pillbtn">&lt;1 year</button>
        <button class="of-pillbtn active">1–3 years</button>
        <button class="of-pillbtn">3–5 years</button>
        <button class="of-pillbtn">5+ years</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Certifications</span>

      <div class="of-cert">
        <span style="width:34px;height:34px;border-radius:10px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12,2 l2.4,4.9 5.4,0.8 -3.9,3.8 0.9,5.4 -4.8,-2.5 -4.8,2.5 0.9,-5.4 -3.9,-3.8 5.4,-0.8 Z"></path></svg></span>
        <div style="flex-grow:1;"><div style="font-weight:600;font-size:14px;">NASM Certified Personal Trainer</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">Verified · Expires 2028</div></div>
        <button class="of-tag-remove" aria-label="Remove"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
      </div>

      <div class="of-cert">
        <span style="width:34px;height:34px;border-radius:10px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12,2 l2.4,4.9 5.4,0.8 -3.9,3.8 0.9,5.4 -4.8,-2.5 -4.8,2.5 0.9,-5.4 -3.9,-3.8 5.4,-0.8 Z"></path></svg></span>
        <div style="flex-grow:1;"><div style="font-weight:600;font-size:14px;">Precision Nutrition L1</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:1px;">Verified · Expires 2027</div></div>
        <button class="of-tag-remove" aria-label="Remove"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
      </div>

      <button style="display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;border:1.5px dashed var(--stone-300);background:transparent;color:var(--pine-dark);font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add certification
      </button>
    </div>

    <div style="flex-grow:1;"></div>

    <button style="height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Continue</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
