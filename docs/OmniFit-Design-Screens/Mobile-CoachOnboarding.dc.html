<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Set up your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-field{border-radius:10px;border:1.5px solid var(--stone-300);padding:12px 14px;font-family:var(--font-body);font-size:15px;color:var(--ink-900);background:var(--surface);width:100%;box-sizing:border-box;}
.of-field:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);}
.of-toggle{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:999px;background:var(--stone-300);position:relative;cursor:pointer;flex-shrink:0;outline:none;}
.of-toggle:checked{background:var(--pine);}
.of-toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .12s;}
.of-toggle:checked::after{left:22px;}
.of-tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--pine);color:var(--cream);font-size:13px;font-weight:600;padding:6px 8px 6px 14px;border-radius:999px;}
.of-tag-remove{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,0.25);border:none;color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
.of-tag-suggest{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;}
.of-tag-suggest:hover{background:var(--stone-150);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:32px 24px 18px;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;font-weight:600;color:var(--ink-500);">Step 1 of 7</span>
        <a href="#skip" style="font-size:12px;font-weight:600;color:var(--ink-500);text-decoration:none;">Skip</a>
      </div>
      <div style="height:4px;border-radius:999px;background:var(--stone-300);overflow:hidden;"><div style="width:14%;height:100%;background:var(--pine);"></div></div>
    </div>

    <h1 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-0.01em;text-wrap:balance;">Set up your coaching profile</h1>

    <div style="display:flex;justify-content:center;">
      <button aria-label="Upload profile photo" style="width:76px;height:76px;border-radius:50%;border:2px dashed var(--stone-300);background:var(--stone-150);display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-500)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,7 h3 l2,-2 h6 l2,2 h3 v12 H4 Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </button>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="bio" style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Bio</label>
      <textarea id="bio" class="of-field" rows="2" placeholder="Tell clients about your coaching style and experience…" style="resize:none;font-family:var(--font-body);"></textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Specialties</span>

      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <span class="of-tagchip">Weight Lifting<button class="of-tag-remove" aria-label="Remove Weight Lifting"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button></span>
        <span class="of-tagchip">General Fitness<button class="of-tag-remove" aria-label="Remove General Fitness"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button></span>
      </div>

      <div style="position:relative;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-500)" stroke-width="2" stroke-linecap="round" style="position:absolute;left:13px;top:13px;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" value="Mob" aria-label="Search or add a specialty" class="of-field" style="padding:9px 14px 9px 38px;">
      </div>

      <div style="background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;padding:5px;box-shadow:0 10px 24px -16px rgba(20,24,28,0.25);">
        <span style="display:block;padding:5px 9px 3px;font-size:10.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">From your tag library</span>
        <div class="of-tag-suggest" style="padding:7px 9px;">
          <span style="width:24px;height:24px;border-radius:7px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6,12.8 l-1.4,1.4 -8.4,-8.4 1.4,-1.4 a2,2 0 0 1 2.8,0 l5.6,5.6 a2,2 0 0 1 0,2.8 Z"></path><path d="M13.4,10.8 L4,20.2 M6,15 l3,3 M9,12 l3,3"></path></svg></span>
          <span style="flex-grow:1;font-size:13.5px;font-weight:500;">Mobility Coaching</span>
          <span style="font-size:11px;color:var(--ink-500);">8 coaches</span>
        </div>
        <div class="of-tag-suggest" style="border-top:1px dashed var(--stone-300);margin-top:1px;padding:8px 9px 7px;">
          <span style="width:24px;height:24px;border-radius:7px;background:var(--stone-150);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--pine-dark);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>
          <span style="flex-grow:1;font-size:13.5px;font-weight:600;color:var(--pine-dark);">Create tag "Mob"</span>
        </div>
      </div>
      <p style="margin:0;font-size:11px;color:var(--ink-500);line-height:1.4;">Search your tag library as you type, or add a new one — it's saved for next time.</p>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;">
      <div><div style="font-weight:600;font-size:14px;">Online training</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">Coach clients remotely, no address needed</div></div>
      <input type="checkbox" class="of-toggle" checked="" aria-label="Online training">
    </div>

    <div style="flex-grow:1;"></div>

    <button style="height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Continue</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
