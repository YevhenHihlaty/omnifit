<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Checkout (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --plum:#7C6A9C; --plum-dark:#5C4E78; --lilac:#DDD2F3;
  --sage:#BFE0C2; --butter:#F7E5A0; --peach:#F8D9BE; --blush:#F8CFDD; --sky:#C3DCF4;
  --warning:#B8842A; --warning-tint:#F7E5A0; --danger:#C1503D; --danger-tint:#F6DAD3;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.m-header{display:flex;align-items:center;padding:48px 16px 12px;flex-shrink:0;position:relative;}
.m-back{width:34px;height:34px;border-radius:10px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--ink-900);cursor:pointer;flex-shrink:0;}
.m-title{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-900);pointer-events:none;}
.m-content{flex:1;overflow:hidden;padding:4px 16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
.m-session{display:flex;flex-direction:column;gap:3px;padding:2px 2px 12px;}
.m-session .t{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink-900);}
.m-session .c{font-size:13px;color:var(--ink-700);}
.m-session .d{font-size:12px;color:var(--ink-500);display:flex;align-items:center;gap:5px;}
.m-card{background:var(--surface);border:1px solid var(--stone-300);border-radius:14px;padding:18px;box-sizing:border-box;}
.m-line{display:flex;justify-content:space-between;font-size:13.5px;}
.m-line .l{color:var(--ink-700);}
.m-line .v{color:var(--ink-900);font-variant-numeric:tabular-nums;font-weight:500;}
.m-lines{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.m-hr{border:none;border-top:1px solid var(--stone-300);margin:0 0 12px;}
.m-total{display:flex;justify-content:space-between;align-items:baseline;}
.m-total .l{font-weight:700;font-size:13.5px;color:var(--ink-900);}
.m-total .v{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--pine-dark);font-variant-numeric:tabular-nums;}
.m-states-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin:2px 0 0;}
.m-strip{background:var(--surface);border:1px solid var(--stone-300);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-sizing:border-box;}
.m-strip-cap{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin:0 0 6px;}
.m-strip .txt{font-size:13px;color:var(--ink-700);font-weight:500;}
.spin{animation:spin 1.6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.m-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;background:var(--danger-tint);color:var(--danger);flex-shrink:0;}
.m-retry{background:transparent;border:none;color:var(--plum-dark);font-family:var(--font-body);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;margin-left:auto;flex-shrink:0;}
.m-cta{border-top:1px solid var(--stone-300);background:var(--surface);padding:14px 20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.btn-primary{height:48px;border-radius:10px;background:var(--pine);color:var(--surface);border:none;font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;width:100%;}
.btn-text{background:transparent;border:none;color:var(--plum-dark);font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;text-align:center;padding:2px 0 0;width:100%;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div class="m-header">
    <button class="m-back" type="button" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="m-title">Checkout</span>
  </div>

  <div class="m-content">
    <div class="m-session">
      <span class="t">Strength Training — 60 min</span>
      <span class="c">with Coach Maria Torres</span>
      <span class="d">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Tue, Sep 23 · 4:00–5:00 PM
      </span>
    </div>

    <div class="m-card">
      <div class="m-lines">
        <div class="m-line"><span class="l">Session price</span><span class="v">$80.00</span></div>
        <div class="m-line"><span class="l">Platform service fee</span><span class="v">$1.50</span></div>
      </div>
      <hr class="m-hr">
      <div class="m-total"><span class="l">Total due today</span><span class="v">$81.50</span></div>
    </div>

    <p class="m-states-label">Other states</p>

    <div>
      <p class="m-strip-cap">State: Processing</p>
      <div class="m-strip">
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 019 9"/></svg>
        <span class="txt">Processing payment…</span>
      </div>
    </div>

    <div>
      <p class="m-strip-cap">State: Payment failed</p>
      <div class="m-strip">
        <span class="m-pill">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          Failed
        </span>
        <span class="txt">Card declined</span>
        <button class="m-retry" type="button">Retry</button>
      </div>
    </div>
  </div>

  <div class="m-cta">
    <button class="btn-primary" type="button">Pay $81.50</button>
    <button class="btn-text" type="button">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
