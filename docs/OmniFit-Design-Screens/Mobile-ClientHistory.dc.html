<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Client history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --butter-tint:#FAF0CE; --butter-dark:#8A6300;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-tab{flex:1;text-align:center;padding:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-500);border-bottom:2px solid transparent;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;}
.of-tab.active{color:var(--ink-900);border-bottom-color:var(--pine);}
.of-filter{border:1.5px solid var(--stone-300);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--ink-700);cursor:pointer;white-space:nowrap;}
.of-filter.active{border-color:var(--pine);background:var(--pine);color:var(--cream);}
.of-day-label{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-500);margin:12px 0 6px;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="padding:48px 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <button aria-label="Back" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"></polyline></svg>
      </button>
      <span style="font-family:var(--font-display);font-weight:600;font-size:15px;">Priya Nair</span>
      <button aria-label="More options" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
      </button>
    </div>

    <div style="padding:14px 20px 0;display:flex;align-items:center;gap:11px;flex-shrink:0;">
      <span style="width:36px;height:36px;border-radius:50%;background:var(--butter-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;">PN</span>
      <span style="flex-grow:1;font-size:12.5px;color:var(--ink-500);">Weight loss · Online coaching</span>
      <span style="background:var(--butter-tint);color:var(--butter-dark);font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:999px;">At risk</span>
    </div>

    <div style="display:flex;gap:14px;padding:16px 20px 0;flex-shrink:0;border-bottom:1px solid var(--stone-300);">
      <button class="of-tab">Snapshot</button>
      <button class="of-tab active">History</button>
      <button class="of-tab">Analytics</button>
    </div>

    <div style="padding:14px 20px 0;display:flex;justify-content:flex-end;flex-shrink:0;position:relative;">
      <button aria-haspopup="true" style="display:flex;align-items:center;gap:7px;border:1.5px solid var(--stone-300);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-700);cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,4 20,4 14,12 14,18 10,20 10,12"></polygon></svg>
        Filter
      </button>

      <!-- Filter panel: opens on tap, lets the coach narrow the log by date range and entry type -->
      <div style="position:absolute;right:20px;top:46px;z-index:2;width:230px;background:var(--surface);border:1.5px solid var(--stone-300);border-radius:12px;box-shadow:0 12px 24px -14px rgba(20,24,28,0.25);padding:14px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);margin-bottom:8px;">Date range</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <input class="of-field" placeholder="From" aria-label="From date" style="text-align:left;">
          <input class="of-field" placeholder="To" aria-label="To date" style="text-align:left;">
        </div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);margin-bottom:8px;">Log type</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700);"><input type="checkbox" checked="" style="width:16px;height:16px;accent-color:var(--pine);">Food</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700);"><input type="checkbox" checked="" style="width:16px;height:16px;accent-color:var(--pine);">Training</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700);"><input type="checkbox" checked="" style="width:16px;height:16px;accent-color:var(--pine);">Metrics</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700);"><input type="checkbox" checked="" style="width:16px;height:16px;accent-color:var(--pine);">Check-ins</label>
        </div>
        <button style="width:100%;height:36px;border:none;border-radius:8px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:12.5px;cursor:pointer;">Apply</button>
      </div>
    </div>

    <div style="padding:2px 20px 16px;overflow:hidden;flex-grow:1;display:flex;flex-direction:column;">

      <span class="of-day-label">Today</span>
      <div style="display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--stone-150);">
          <span style="width:30px;height:30px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4,12 c0,-5 3,-8 8,-8 s8,3 8,8 -3,8 -8,8 -8,-3 -8,-8 Z"></path></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13px;font-weight:500;">Logged breakfast — 420 cal</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);flex-shrink:0;">8:12 AM</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--stone-150);">
          <span style="width:30px;height:30px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4,12 c0,-5 3,-8 8,-8 s8,3 8,8 -3,8 -8,8 -8,-3 -8,-8 Z"></path></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13px;font-weight:500;">Logged lunch — 610 cal</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);flex-shrink:0;">12:40 PM</span>
        </div>
      </div>

      <span class="of-day-label">Yesterday</span>
      <div style="display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--stone-150);">
          <span style="width:30px;height:30px;border-radius:9px;background:var(--butter-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--butter-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="7" x2="12" y2="13"></line><circle cx="12" cy="16.2" r="0.6" fill="var(--butter-dark)"></circle></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13px;font-weight:500;">Missed daily check-in</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);flex-shrink:0;">—</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--stone-150);">
          <span style="width:30px;height:30px;border-radius:9px;background:var(--stone-150);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-700)" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="4" width="6" height="16" rx="2"></rect><path d="M9,7 h-2 M9,17 h-2 M17,7 h-2 M17,17 h-2"></path></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13px;font-weight:500;">Logged weight — 144.8 lb</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);flex-shrink:0;">7:05 AM</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;">
          <span style="width:30px;height:30px;border-radius:9px;background:var(--pine-tint);flex-shrink:0;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg></span>
          <div style="flex-grow:1;min-width:0;"><div style="font-size:13px;font-weight:500;">Completed workout — Full body</div></div>
          <span style="font-size:11.5px;color:var(--ink-500);flex-shrink:0;">6:30 PM</span>
        </div>
      </div>

    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
