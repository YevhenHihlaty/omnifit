<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Body metrics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-field{height:46px;border-radius:10px;border:1.5px solid var(--stone-300);padding:0 14px;font-family:var(--font-body);font-size:15px;color:var(--ink-900);background:var(--surface);width:100%;box-sizing:border-box;}
.of-field:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);}
.of-unit{border:none;border-radius:8px;background:var(--stone-150);color:var(--ink-700);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;}
.of-unit[aria-pressed="true"]{background:var(--pine);color:var(--cream);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:52px 20px 20px;display:flex;flex-direction:column;">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px;">
      <button aria-label="Back" style="width:36px;height:36px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"></polyline></svg>
      </button>
      <h1 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;">Body metrics</h1>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <span style="font-size:13px;color:var(--ink-500);">Recording for</span>
      <button style="display:flex;align-items:center;gap:6px;border:1.5px solid var(--stone-300);border-radius:999px;background:var(--surface);padding:6px 12px;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-900);cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg>
        Today, Sep 20
      </button>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Weight</span>
      <div style="display:flex;align-items:baseline;gap:6px;">
        <input type="text" inputmode="decimal" value="144.8" aria-label="Weight" style="width:130px;border:none;background:transparent;font-family:var(--font-display);font-weight:700;font-size:44px;color:var(--ink-900);text-align:right;">
        <span style="font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink-500);">lb</span>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="of-unit" aria-pressed="true">lb</button>
        <button class="of-unit" aria-pressed="false">kg</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Optional measurements</span>

      <div style="display:flex;gap:12px;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <label for="bf" style="font-size:12px;color:var(--ink-700);">Body fat %</label>
          <input id="bf" class="of-field" type="text" inputmode="decimal" placeholder="—">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <label for="waist" style="font-size:12px;color:var(--ink-700);">Waist (in)</label>
          <input id="waist" class="of-field" type="text" inputmode="decimal" placeholder="—">
        </div>
      </div>
      <div style="display:flex;gap:12px;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <label for="chest" style="font-size:12px;color:var(--ink-700);">Chest (in)</label>
          <input id="chest" class="of-field" type="text" inputmode="decimal" placeholder="—">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <label for="hips" style="font-size:12px;color:var(--ink-700);">Hips (in)</label>
          <input id="hips" class="of-field" type="text" inputmode="decimal" placeholder="—">
        </div>
      </div>
    </div>

    <div style="margin-top:22px;display:flex;flex-direction:column;gap:8px;">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Progress photo</span>
      <button style="height:76px;border-radius:12px;border:2px dashed var(--stone-300);background:var(--stone-150);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-500);cursor:pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,7 h3 l2,-2 h6 l2,2 h3 v12 H4 Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span style="font-size:13px;font-weight:600;">Add photo (optional)</span>
      </button>
    </div>

    <div style="flex-grow:1;"></div>

    <button style="height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Save entry</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
