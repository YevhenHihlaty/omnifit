<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Weekly check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-slider-row{display:flex;flex-direction:column;gap:8px;}
.of-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(to right,var(--pine) 0%,var(--pine) 60%,var(--stone-300) 60%,var(--stone-300) 100%);}
.of-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--pine);cursor:pointer;box-shadow:0 1px 3px rgba(20,24,28,0.2);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="padding:44px 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
      <button aria-label="Close" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
      <span style="font-family:var(--font-display);font-weight:600;font-size:15px;">Weekly check-in</span>
      <span style="width:32px;"></span>
    </div>

    <div style="padding:16px 20px 0;flex-shrink:0;">
      <h1 style="margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.01em;">How was your week?</h1>
      <p style="margin:0;font-size:13px;color:var(--ink-500);">Week ending Sunday, Sep 20 · takes under a minute</p>
    </div>

    <div style="padding:22px 20px 0;overflow:hidden;flex-grow:1;display:flex;flex-direction:column;gap:22px;">

      <div class="of-slider-row">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,15 a8,6 0 0 1 16,0 v2 H4 Z"></path><line x1="4" y1="17" x2="4" y2="19"></line><line x1="20" y1="17" x2="20" y2="19"></line></svg>Sleep quality</span><span style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);">3 / 5</span></div>
        <input type="range" min="1" max="5" value="3" class="of-slider" aria-label="Sleep quality">
      </div>

      <div class="of-slider-row">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"></rect><rect x="19" y="9" width="3" height="6" rx="1"></rect><rect x="6" y="7" width="3" height="10" rx="1"></rect><rect x="15" y="7" width="3" height="10" rx="1"></rect></svg>Muscle soreness</span><span style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);">2 / 5</span></div>
        <input type="range" min="1" max="5" value="2" class="of-slider" style="background:linear-gradient(to right,var(--pine) 0%,var(--pine) 30%,var(--stone-300) 30%,var(--stone-300) 100%);" aria-label="Muscle soreness">
      </div>

      <div class="of-slider-row">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9,15 c0.8,-1 4.2,-1 6,0"></path><line x1="9" y1="9" x2="9" y2="9"></line><line x1="15" y1="9" x2="15" y2="9"></line></svg>Stress level</span><span style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);">2 / 5</span></div>
        <input type="range" min="1" max="5" value="2" class="of-slider" style="background:linear-gradient(to right,var(--pine) 0%,var(--pine) 30%,var(--stone-300) 30%,var(--stone-300) 100%);" aria-label="Stress level">
      </div>

      <div class="of-slider-row">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13,2 L4,14 h6 l-1,8 9,-12 h-6 Z"></path></svg>Energy</span><span style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);">4 / 5</span></div>
        <input type="range" min="1" max="5" value="4" class="of-slider" style="background:linear-gradient(to right,var(--pine) 0%,var(--pine) 80%,var(--stone-300) 80%,var(--stone-300) 100%);" aria-label="Energy">
      </div>

      <div class="of-slider-row">
        <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pine-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12,2 l2.9,6 6.6,0.9 -4.8,4.6 1.1,6.5 -5.8,-3 -5.8,3 1.1,-6.5 -4.8,-4.6 6.6,-0.9 Z"></path></svg>Motivation</span><span style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);">4 / 5</span></div>
        <input type="range" min="1" max="5" value="4" class="of-slider" style="background:linear-gradient(to right,var(--pine) 0%,var(--pine) 80%,var(--stone-300) 80%,var(--stone-300) 100%);" aria-label="Motivation">
      </div>

    </div>

    <div style="flex-shrink:0;padding:14px 20px 22px;border-top:1px solid var(--stone-300);background:var(--surface);">
      <button style="width:100%;height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Submit check-in</button>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
