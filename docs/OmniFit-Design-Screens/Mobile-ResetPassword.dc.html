<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.of-field{height:48px;border-radius:10px;border:1.5px solid var(--stone-300);padding:0 14px;font-family:var(--font-body);font-size:15px;color:var(--ink-900);background:var(--surface);width:100%;box-sizing:border-box;}
.of-field:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;padding:56px 28px 24px;display:flex;flex-direction:column;">

    <button aria-label="Back" style="width:32px;height:32px;border:none;background:transparent;color:var(--ink-900);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-bottom:26px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"></polyline></svg>
    </button>

    <h1 style="margin:0 0 8px;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-0.01em;">Reset your password</h1>
    <p style="margin:0 0 28px;font-size:14px;color:var(--ink-500);line-height:1.5;">Enter your email and we'll send you a reset link.</p>

    <form style="display:flex;flex-direction:column;gap:18px;">
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label for="rp-email" style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-500);">Email</label>
        <input id="rp-email" class="of-field" type="email" placeholder="taylor@email.com">
      </div>
      <button type="submit" style="height:48px;border:none;border-radius:10px;background:var(--ink-900);color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;">Send reset link</button>
    </form>

    <div style="flex-grow:1;"></div>

    <p style="text-align:center;font-size:14px;margin:0;"><a href="#login" style="color:var(--pine-dark);font-weight:600;text-decoration:none;">Back to log in</a></p>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
