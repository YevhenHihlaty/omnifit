<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniFit — Add product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7EF; --surface:#FFFFFF; --ink-900:#14181C; --ink-700:#3E443F; --ink-500:#6E7268;
  --stone-300:#E3DECF; --stone-150:#F1ECDF;
  --pine:#3F6B4F; --pine-dark:#2C4F39; --pine-tint:#DCEBE0;
  --plum:#7C6A9C; --plum-dark:#5C4E78; --lilac:#DDD2F3;
  --sage:#BFE0C2; --butter:#F7E5A0; --peach:#F8D9BE; --blush:#F8CFDD; --sky:#C3DCF4;
  --warning:#B8842A; --warning-tint:#F7E5A0; --danger:#C1503D; --danger-tint:#F6DAD3;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
}
body{margin:0;background:var(--cream);}
.header{height:64px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--stone-300);display:flex;align-items:center;justify-content:space-between;padding:0 32px;box-sizing:border-box;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink-900);}
.nav{display:flex;gap:28px;margin-left:36px;}
.nav a{font-size:14px;font-weight:600;color:var(--ink-500);text-decoration:none;}
.nav a.active{color:var(--ink-900);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pine-dark);}
.main{flex:1 1 auto;overflow:hidden;}
.container{max-width:1000px;margin:0 auto;padding:32px;box-sizing:border-box;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--plum-dark);text-decoration:none;margin-bottom:16px;}
.page-title{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--ink-900);margin:0 0 6px 0;}
.page-sub{font-size:14px;color:var(--ink-500);margin:0 0 28px 0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
.field-card{background:var(--surface);border:1px solid var(--stone-300);border-radius:16px;padding:24px;}
.card-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-900);margin:0 0 18px 0;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:13px;font-weight:600;color:var(--ink-700);}
.field .hint{font-size:12px;font-weight:400;color:var(--ink-500);}
.field input{height:46px;border-radius:10px;border:1.5px solid var(--stone-300);padding:0 14px;font-size:14.5px;font-family:var(--font-body);color:var(--ink-900);box-sizing:border-box;background:var(--surface);}
.field input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.nutrition-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.nutri-field{display:flex;flex-direction:column;gap:6px;}
.nutri-field label{font-size:13px;font-weight:600;color:var(--ink-700);}
.unit-input{position:relative;}
.unit-input input{width:100%;height:46px;border-radius:10px;border:1.5px solid var(--stone-300);padding:0 40px 0 14px;font-size:14.5px;font-family:var(--font-body);color:var(--ink-900);box-sizing:border-box;background:var(--surface);font-variant-numeric:tabular-nums;}
.unit-input span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-500);}
.checkbox-row{display:flex;align-items:center;gap:10px;margin-top:22px;}
.checkbox-row input{width:18px;height:18px;accent-color:var(--pine);}
.checkbox-row label{font-size:14px;color:var(--ink-700);}
.actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end;}
.btn-outline{height:46px;border-radius:10px;border:1.5px solid var(--stone-300);background:transparent;color:var(--ink-900);font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:0 22px;cursor:pointer;}
.btn-primary{height:46px;border-radius:10px;background:var(--pine);color:var(--surface);border:none;font-family:var(--font-body);font-weight:600;font-size:14.5px;padding:0 24px;cursor:pointer;}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:var(--cream);font-family:var(--font-body);color:var(--ink-900);display:flex;flex-direction:column;overflow:hidden;">
  <header class="header">
    <div style="display:flex;align-items:center;">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 120 120" aria-hidden="true"><circle cx="58" cy="62" r="31" fill="none" stroke="var(--pine)" stroke-width="9"/><circle cx="90" cy="32" r="14" fill="var(--pine)"/></svg>
        <span class="brand-name">OmniFit</span>
      </div>
      <nav class="nav">
        <a href="#" class="active">Home</a>
        <a href="#">Training</a>
        <a href="#">Calendar</a>
        <a href="#">Profile</a>
      </nav>
    </div>
    <div class="avatar">JM</div>
  </header>
  <main class="main">
    <div class="container">
      <a href="#" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
        Back to search
      </a>
      <h1 class="page-title">Add product</h1>
      <p class="page-sub">Can't find it in search? Add the nutrition info manually.</p>
      <div class="form-grid">
        <div class="field-card">
          <h2 class="card-title">Product details</h2>
          <div class="field">
            <label for="p-name">Product name</label>
            <input id="p-name" type="text" placeholder="e.g. Overnight oats with almond butter">
          </div>
          <div class="field">
            <label for="p-brand">Brand <span class="hint">(optional)</span></label>
            <input id="p-brand" type="text" placeholder="e.g. Homemade, or a store brand">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="p-serving">Serving size</label>
              <input id="p-serving" type="text" value="1" style="font-variant-numeric:tabular-nums;">
            </div>
            <div class="field">
              <label for="p-unit">Unit</label>
              <input id="p-unit" type="text" value="cup" placeholder="g, ml, cup, piece">
            </div>
          </div>
        </div>
        <div>
          <div class="field-card">
            <h2 class="card-title">Nutrition per serving</h2>
            <div class="nutrition-grid">
              <div class="nutri-field">
                <label for="n-cal">Calories</label>
                <div class="unit-input"><input id="n-cal" type="text" value="340"><span>kcal</span></div>
              </div>
              <div class="nutri-field">
                <label for="n-protein">Protein</label>
                <div class="unit-input"><input id="n-protein" type="text" value="14"><span>g</span></div>
              </div>
              <div class="nutri-field">
                <label for="n-carbs">Carbs</label>
                <div class="unit-input"><input id="n-carbs" type="text" value="46"><span>g</span></div>
              </div>
              <div class="nutri-field">
                <label for="n-fat">Fat</label>
                <div class="unit-input"><input id="n-fat" type="text" value="11"><span>g</span></div>
              </div>
            </div>
            <div class="checkbox-row">
              <input id="save-library" type="checkbox" checked>
              <label for="save-library">Save to my food library for next time</label>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn-outline">Cancel</button>
            <button type="button" class="btn-primary">Add to log</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
